name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test -p trot-core
      - name: corpus audit (0% noise)
        run: cargo run --release -p trot-core --example corpus_audit -- 42 256 0.0
      - name: corpus audit (8% noise)
        run: cargo run --release -p trot-core --example corpus_audit -- 42 256 0.08
      - name: build wasm
        run: cargo build --release -p trot-wasm --target wasm32-unknown-unknown
      - name: wasm smoke (fresh build)
        run: node scripts/check_wasm.mjs target/wasm32-unknown-unknown/release/trot_wasm.wasm
      - name: wasm smoke (committed page artifact)
        run: node scripts/check_wasm.mjs trot.wasm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: onnx round-trip
        run: |
          pip install --quiet onnx onnxruntime numpy
          cargo run --release -p trot-core --example export_onnx
          python3 scripts/validate_onnx.py

  activation-l2:
    name: activation x L2 (${{ matrix.activation }}, L2 ${{ matrix.l2 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - activation: tanh
            l2: "off"
            test: tanh_l2_off
          - activation: tanh
            l2: "on"
            test: tanh_l2_on
          - activation: relu
            l2: "off"
            test: relu_l2_off
          - activation: relu
            l2: "on"
            test: relu_l2_on
          - activation: leaky_relu
            l2: "off"
            test: leaky_relu_l2_off
          - activation: leaky_relu
            l2: "on"
            test: leaky_relu_l2_on
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: activation x L2 cell
        run: cargo test -p trot-core --test activation_matrix ${{ matrix.test }} -- --exact

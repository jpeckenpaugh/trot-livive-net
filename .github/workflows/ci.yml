name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test -p trot-core
      - name: build wasm
        run: cargo build --release -p trot-wasm --target wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: onnx round-trip
        run: |
          pip install --quiet onnx onnxruntime numpy
          cargo run --release -p trot-core --example export_onnx
          python3 scripts/validate_onnx.py
